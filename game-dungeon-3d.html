<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dungeon 3D — Nodal</title>
<style>
  html,body{margin:0;height:100%;background:#06070A;color:#EFEDE6;
    font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
  #c{display:block;width:100%;height:100%}
  #hud{position:fixed;top:12px;left:12px;font:12px/1.6 ui-monospace,monospace;
    color:rgba(239,237,230,.6);pointer-events:none;text-shadow:0 1px 3px #000}
  #hud b{color:#F87171}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>Dungeon 3D</b> · Nodal<br>WASD jalan · mouse lihat</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x06070A);
scene.fog=new THREE.FogExp2(0x06070A,0.045);
const camera=new THREE.PerspectiveCamera(70,1,0.1,200);

scene.add(new THREE.AmbientLight(0xffffff,0.35));
const lamp=new THREE.PointLight(0xF87171,2.2,26);
lamp.position.set(0,4,0);
scene.add(lamp);

const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(80,80),
  new THREE.MeshStandardMaterial({color:0x14171C,roughness:0.95})
);
floor.rotation.x=-Math.PI/2;
scene.add(floor);

const grid=new THREE.GridHelper(80,80,0x2a2f3a,0x1b1f26);
grid.position.y=0.01;
scene.add(grid);

const geo=new THREE.BoxGeometry(3,3,3);
const mat=new THREE.MeshStandardMaterial({color:0x0F1216,roughness:0.85});
const props=[];
for(let i=0;i<44;i++){
  const m=new THREE.Mesh(geo,mat.clone());
  const h=1.2+Math.random()*4;
  m.scale.set(1+Math.random()*1.5,h,1+Math.random()*1.5);
  m.position.set((Math.random()-.5)*66,h/2,(Math.random()-.5)*66);
  m.material.color.setHex(0x141821);
  scene.add(m);
  props.push({m,ph:Math.random()*6.28});
}

const pos=new THREE.Vector3(0,1.7,8);
const vel=new THREE.Vector3();
let yaw=0,pit=0;
const keys={};
addEventListener('keydown',e=>keys[e.code]=true);
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{yaw-=e.movementX*.0022;pit-=e.movementY*.0022});
addEventListener('click',()=>canvas.requestPointerLock());
addEventListener('pointerlockchange',()=>{
  canvas.style.cursor=document.pointerLockElement?'none':'default';
});

function resize(){
  const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

let last=performance.now();
function tick(now){
  const dt=Math.min((now-last)/1000,.05);last=now;

  const f=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  const s=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  const boost=keys.ShiftLeft?1.9:1;
  const vx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*7*boost*dt;
  const vz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*7*boost*dt;
  vel.x+=(vx-vel.x)*Math.min(1,dt*9);
  vel.z+=(vz-vel.z)*Math.min(1,dt*9);
  pos.x+=vel.x;pos.z+=vel.z;
  pos.x=Math.max(-38,Math.min(38,pos.x));
  pos.z=Math.max(-38,Math.min(38,pos.z));

  const bob=Math.sin(now*.009)*.045;
  camera.position.set(pos.x,pos.y+bob,pos.z);
  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;
  camera.rotation.x=pit;

  lamp.position.set(pos.x,4,pos.z);
  lamp.intensity=1.8+Math.sin(now*.004)*.35;

  props.forEach((p,i)=>{p.m.rotation.y+=dt*.35*(i%2?1:-1)});

  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
